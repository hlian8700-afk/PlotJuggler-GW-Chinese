name: Windows x64 build (PlotJuggler 3.17.0)

on:
  push:
    branches: [ main, feature/plot-theme-palette, feature/waveform-stage1, feature/torque-analysis-224, feature/yaw-analysis-m56, feature/analysis-ui-remediation, feature/shared-workspace-18, feature/diagnosis-foundation, feature/diagnosis-import-preview2, feature/diagnosis-vendor-csv, feature/diagnosis-real-sample, feature/diagnosis-rule-trial, feature/diagnosis-condition-pack, feature/diagnosis-local-batch ]
    paths:
      - 'patches/**'
      - '.github/workflows/windows-build.yml'
      - 'data/**'
      - 'assets/**'
      - 'installer/**'
      - 'PROJECT_SPEC.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-2022
    steps:
      - name: Checkout customization repository
        uses: actions/checkout@v4
        with:
          path: customization

      - name: Verify analysis math regressions
        shell: pwsh
        run: |
          cmake -S customization/tests -B analysis-tests -A x64
          if ($LASTEXITCODE -ne 0) { throw "Analysis test configuration failed" }
          cmake --build analysis-tests --config Release
          if ($LASTEXITCODE -ne 0) { throw "Analysis test build failed" }
          ctest --test-dir analysis-tests -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Analysis regression failed" }

      - name: Prepare example labels for public builds
        if: ${{ !github.event.repository.private }}
        shell: pwsh
        run: |
          @(
            'raw_tag,cn_name'
            'demo_speed,示例转速'
            'demo_power,示例功率'
          ) | Set-Content -LiteralPath "customization/data/gw_tag_mapping.csv" -Encoding UTF8

      - name: Verify required mapping file
        shell: pwsh
        run: |
          if (!(Test-Path "customization/data/gw_tag_mapping.csv")) {
            throw "Missing data/gw_tag_mapping.csv. Upload the supplied UTF-8 CSV to this path in the private repository, then rerun the workflow."
          }

      - name: Checkout upstream PlotJuggler 3.17.0
        uses: actions/checkout@v4
        with:
          repository: PlotJuggler/PlotJuggler
          ref: 3.17.0
          path: upstream

      - name: Apply Goldwind display-name patch
        shell: pwsh
        run: |
          Copy-Item ../customization/data/gw_tag_mapping.csv plotjuggler_app/gw_tag_mapping.csv
          & ../customization/patches/apply-goldwind-patch.ps1
        working-directory: upstream

      - name: Install Qt 5.15.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          # Qt WebSockets is included in the Qt 5.15 desktop archive; avoid unavailable add-on packages.
          cache: true

      - name: Verify SC and ActionList import dialogs before the full build
        shell: pwsh
        run: |
          cmake -S customization/tests/diagnosis-qt -B diagnosis-qt-tests -A x64 -DQt5_DIR="$env:Qt5_DIR"
          if ($LASTEXITCODE -ne 0) { throw "Event test configuration failed" }
          cmake --build diagnosis-qt-tests --config Release
          if ($LASTEXITCODE -ne 0) { throw "Event test compilation failed" }
          & diagnosis-qt-tests/Release/diagnosis-trial-test.exe
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic trial core regression failed" }
          & diagnosis-qt-tests/Release/diagnosis-pack-test.exe
          if ($LASTEXITCODE -ne 0) { throw "Condition pack regression failed" }
          & diagnosis-qt-tests/Release/diagnosis-fusion-test.exe
          if ($LASTEXITCODE -ne 0) { throw "Candidate evidence fusion regression failed" }
          $env:QT_QPA_PLATFORM = "offscreen"
          & diagnosis-qt-tests/Release/diagnosis-batch-test.exe
          if ($LASTEXITCODE -ne 0) { throw "Local batch regression failed" }
          & diagnosis-qt-tests/Release/diagnosis-qt-test.exe
          if ($LASTEXITCODE -ne 0) { throw "SC / ActionList import regression failed" }
          Remove-Item Env:QT_QPA_PLATFORM

      - name: Embed approved BladeScope icon in Windows EXE resources
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python customization/assets/render_icon.py
          if ($LASTEXITCODE -ne 0) { throw "BladeScope icon rendering failed" }
          $icon = "customization/assets/BladeScope.ico"
          if (!(Test-Path $icon)) { throw "BladeScope.ico missing" }
          # Upstream plotjuggler_app/plotjuggler.rc embeds ../plotjuggler.ico.
          # Replace that source icon BEFORE CMake compiles the .rc resource.
          Copy-Item $icon "upstream/plotjuggler.ico" -Force
          Write-Host "BladeScope ICO embedded as the Windows executable icon resource."

      - name: Configure
        shell: pwsh
        run: |
          cmake -S upstream -B build -A x64 -DQt5_DIR="$env:Qt5_DIR" -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_FIND_PACKAGE_Python3=TRUE -DCMAKE_DISABLE_FIND_PACKAGE_Python=TRUE

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release --prefix "$env:GITHUB_WORKSPACE\stage"

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $exe = Get-ChildItem "$env:GITHUB_WORKSPACE\stage" -Recurse -Filter plotjuggler.exe | Select-Object -First 1
          if (!$exe) { throw "plotjuggler.exe was not produced by the build." }
          windeployqt --release --compiler-runtime $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "Qt deployment failed" }
          $sqlDriver = Join-Path $exe.DirectoryName "sqldrivers/qsqlite.dll"
          if (!(Test-Path $sqlDriver)) {
            New-Item -ItemType Directory -Force (Split-Path $sqlDriver) | Out-Null
            Copy-Item (Join-Path $env:QT_ROOT_DIR "plugins/sqldrivers/qsqlite.dll") $sqlDriver
          }
          if (!(Test-Path $sqlDriver)) { throw "Qt SQLite driver is missing" }
          Copy-Item customization/data/gw_tag_mapping.csv $exe.DirectoryName
          # Upstream plugin install destination is configured as an absolute path
          # (C:/Program Files/plotjuggler/...), outside our custom stage prefix.
          # Collect the compiled plugins beside the executable, which MainWindow scans.
          $pluginSources = @(
            (Join-Path $env:GITHUB_WORKSPACE "stage/lib/plotjuggler/plugins"),
            "C:/Program Files/plotjuggler/lib/plotjuggler/plugins"
          )
          $pluginDlls = @($pluginSources | ForEach-Object {
            if (Test-Path $_) { Get-ChildItem $_ -Filter *.dll -File }
          })
          if (!$pluginDlls) { throw "No PlotJuggler plugins were installed" }
          $csvPlugin = @($pluginDlls | Where-Object { $_.Name -eq "DataLoadCSV.dll" })
          if (!$csvPlugin) { throw "DataLoadCSV.dll missing from plugin install output" }
          foreach ($dll in $pluginDlls) {
            Copy-Item $dll.FullName (Join-Path $exe.DirectoryName $dll.Name) -Force
          }
          if (!(Test-Path (Join-Path $exe.DirectoryName "DataLoadCSV.dll"))) {
            throw "CSV plugin not deployed beside PlotJuggler executable"
          }
          Write-Host "Deployed $($pluginDlls.Count) PlotJuggler plugins into bin"
          # The Goldwind labels do not need embedded Python. Ensure the application
          # does not accidentally depend on the runner-only Python 3.14 DLL.
          # Read the PE import table using a Visual Studio developer environment.
          $vswhere = "${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem (Join-Path $vs "VC\\Tools\\MSVC") -Filter dumpbin.exe -Recurse -File |
            Where-Object { $_.FullName -match 'Hostx64[\\\\/]x64' } | Select-Object -First 1
          if (!$dumpbin) { throw "Visual Studio dumpbin.exe not found" }
          $pythonImport = & $dumpbin.FullName /dependents $exe.FullName 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "PE dependency inspection failed" }
          if ($pythonImport -match "python3[0-9]+\\.dll") { throw "Unexpected Python runtime dependency in plotjuggler.exe" }
          # Upstream copies wasmer.dll beside the build-tree executable, but cmake --install
          # does not include it. windeployqt only deploys Qt dependencies.
          $wasmer = Get-ChildItem "$env:GITHUB_WORKSPACE\build" -Recurse -File -Filter wasmer.dll |
            Where-Object { $_.FullName -match '[\\/]bin[\\/]' } | Select-Object -First 1
          if (!$wasmer) {
            $wasmer = Get-ChildItem "$env:GITHUB_WORKSPACE\build" -Recurse -File -Filter wasmer.dll | Select-Object -First 1
          }
          if (!$wasmer) { throw "wasmer.dll missing from build; cannot create a working installer." }
          Copy-Item $wasmer.FullName (Join-Path $exe.DirectoryName "wasmer.dll") -Force
          if (!(Test-Path (Join-Path $exe.DirectoryName "wasmer.dll"))) { throw "Failed to deploy wasmer.dll" }
          Write-Host "Bundled wasmer.dll from $($wasmer.FullName)"

      - name: Generate and deploy BladeScope application icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python customization/assets/render_icon.py
          if ($LASTEXITCODE -ne 0) { throw "BladeScope icon generation failed" }
          $exe = Get-ChildItem "$env:GITHUB_WORKSPACE\stage" -Recurse -Filter plotjuggler.exe | Select-Object -First 1
          if (!$exe) { throw "Executable missing while deploying BladeScope icon" }
          Copy-Item customization/assets/BladeScope.ico $exe.DirectoryName -Force
          Write-Host "BladeScope multi-resolution icon generated and deployed."
          
      - name: Finalize BladeScope runtime naming and remove developer headers
        shell: pwsh
        run: |
          $bin = Join-Path $env:GITHUB_WORKSPACE "stage/bin"
          $oldExe = Join-Path $bin "plotjuggler.exe"
          $newExe = Join-Path $bin "BladeScope.exe"
          if (!(Test-Path $oldExe)) { throw "Original application executable missing" }
          Move-Item -LiteralPath $oldExe -Destination $newExe -Force
          if (!(Test-Path $newExe)) { throw "BladeScope.exe rename failed" }
          # The portable/installer distributions are runtime products, not SDKs.
          # Keep original C++ header identifiers in source code for ABI/API compatibility,
          # but do not distribute upstream PlotJuggler developer headers.
          $headers = Join-Path $env:GITHUB_WORKSPACE "stage/include"
          if (Test-Path $headers) { Remove-Item -LiteralPath $headers -Recurse -Force }
          Write-Host "Packaged BladeScope.exe without unnecessary developer headers."

      - name: Package portable x64 build
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\stage\*" -DestinationPath "$env:GITHUB_WORKSPACE\BladeScope-3.17.0.25-win64-portable.zip" -Force

      - name: Build Windows EXE installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "/DStageDir=$env:GITHUB_WORKSPACE\stage" "customization/installer/goldwind.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler failed." }
          $setup = "customization/installer/BladeScope-3.17.0.25-win64-Setup.exe"
          if (!(Test-Path $setup)) { throw "Expected installer EXE not found." }
          Write-Host "Installer created: $setup"

      - name: Smoke test EXE installer and Chinese mapping
        shell: pwsh
        run: |
          $setup = Join-Path $env:GITHUB_WORKSPACE "customization/installer/BladeScope-3.17.0.25-win64-Setup.exe"
          $target = Join-Path $env:RUNNER_TEMP "BladeScope-SmokeTest"
          $proc = Start-Process -FilePath $setup -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$target") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Installer failed with exit code $($proc.ExitCode)" }
          $exe = Join-Path $target "bin/BladeScope.exe"
          $csv = Join-Path $target "bin/gw_tag_mapping.csv"
          if (!(Test-Path $exe)) { throw "Installed BladeScope executable missing" }
          if (!(Test-Path (Join-Path $target "bin/sqldrivers/qsqlite.dll"))) { throw "Installed Qt SQLite driver missing" }
          if (!(Test-Path $csv)) { throw "Installed Goldwind Chinese dictionary missing" }
          if (!(Test-Path (Join-Path $target "bin/DataLoadCSV.dll"))) { throw "Installed CSV plugin missing" }
          if (!(Test-Path (Join-Path $target "bin/wasmer.dll"))) { throw "Installed wasmer.dll missing" }
          if (!(Test-Path (Join-Path $target "bin/BladeScope.ico"))) { throw "BladeScope icon missing from installed files" }
          # Launch for a few seconds to catch Windows loader errors (e.g. missing DLLs).
          $app = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 8
          $app.Refresh()
          if ($app.HasExited) { throw "Installed application exited during startup (code $($app.ExitCode)); inspect runtime dependencies." }
          Stop-Process -Id $app.Id -Force
          Write-Host "GUI executable survived startup smoke test."
          $rows = @(Import-Csv -LiteralPath $csv -Encoding UTF8)
          $expectedRows = if ('${{ github.event.repository.private }}' -eq 'true') { 1981 } else { 2 }
          if ($rows.Count -ne $expectedRows) { throw "Expected $expectedRows mappings, found $($rows.Count)" }
          if ($expectedRows -eq 2 -and (($rows.raw_tag -join ',') -ne 'demo_speed,demo_power')) {
            throw "Public installer must contain only example labels"
          }
          if (@($rows | Where-Object { [string]::IsNullOrWhiteSpace($_.raw_tag) -or [string]::IsNullOrWhiteSpace($_.cn_name) }).Count -ne 0) {
            throw "Chinese dictionary contains blank tags or labels"
          }
          Write-Host "Installer silent install and $expectedRows mapping checks passed."

      - name: Verify M01, M33 and M56 inside the installed Qt application
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "BladeScope-SmokeTest/bin/BladeScope.exe"
          $acceptanceRoot = Join-Path $env:RUNNER_TEMP "BladeScope-FitAcceptance"
          foreach ($scale in @("1", "1.25", "1.5", "2")) {
            $env:QT_SCALE_FACTOR = $scale
            $env:BLADESCOPE_FIT_ACCEPTANCE_OUTPUT = Join-Path $acceptanceRoot "scale-$scale"
            New-Item -ItemType Directory -Force $env:BLADESCOPE_FIT_ACCEPTANCE_OUTPUT | Out-Null
            $app = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
            if (!$app.WaitForExit(60000)) {
              Stop-Process -Id $app.Id -Force
              throw "Qt analysis acceptance timed out at scale $scale"
            }
            if ($app.ExitCode -ne 0) {
              $log = Join-Path $env:BLADESCOPE_FIT_ACCEPTANCE_OUTPUT "failure.txt"
              if (Test-Path $log) { Get-Content -Encoding UTF8 $log }
              throw "Qt analysis acceptance failed at scale $scale with exit $($app.ExitCode)"
            }
          }
          Remove-Item Env:QT_SCALE_FACTOR
          $csv = Join-Path $env:BLADESCOPE_FIT_ACCEPTANCE_OUTPUT "m01-bins.csv"
          if (!(Test-Path $csv) -or @(Import-Csv -LiteralPath $csv -Encoding UTF8).Count -ne 3) {
            throw "Expected a CSV with three M01 bins"
          }
          Write-Host "Verified three M01 bins, fitted coefficients, exported CSV, and return to time series."

      - name: Upload Qt acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BladeScope-fit-acceptance-diagnostics
          path: ${{ runner.temp }}/BladeScope-FitAcceptance/
          if-no-files-found: ignore

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.private && 'BladeScope-3.17.0.25-win64' || 'BladeScope-3.17.0.25-win64-demo' }}
          path: |
            BladeScope-3.17.0.25-win64-portable.zip
            customization/installer/BladeScope-3.17.0.25-win64-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish local diagnosis preview after installed acceptance
        if: github.ref_name == 'feature/diagnosis-local-batch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versionTag = "v3.17.0.25-preview.1"
          $portable = "BladeScope-3.17.0.25-win64-portable.zip"
          $installer = "customization/installer/BladeScope-3.17.0.25-win64-Setup.exe"
          $bundle = "BladeScope-3.17.0.25-win64.zip"
          Compress-Archive -LiteralPath $portable, $installer -DestinationPath $bundle -CompressionLevel NoCompression
          $notes = Join-Path $env:RUNNER_TEMP "bladescope-release-notes.md"
          @'
          本地批量故障证据预览版，稳定基线仍为 3.17.0.18。

          新增“分析 → 故障分析（预览）→ 本地批量”：在原工作区管理本地 TXT / CSV 录波任务，关联可选 SC / ActionList，复用条件规则包和测点映射，支持状态筛选、逐条计算、取消、失败重试、手动中心时间、双击详情及批量摘要导出。
          报告按任务与尝试编号独立保存，已完成任务不会自动重复执行；参数修改后需重新确认。读取完整窗口样本，不用显示抽稀数据。共享同一批事件解析缓存，限制文件/行/样本规模，单个文件失败不阻塞后续任务。窗口边缘缺测不再误判为覆盖完整。
          默认时间：无时区文本按 UTC+08:00，数字时间按 Unix 秒；可修改。自动关联只检索同目录同日期标准文件名，仍需核对机组与时间，代码缺失且覆盖未确认保持未知。每个任务只对应一个录波文件，本版尚不支持跨文件拼接、网络目录超时隔离或 DATA 批量读取。
          规则阈值和最终根因仍需真实案例标定；待验证规则仅显式试跑，草稿和停用项不执行，不输出虚构准确率。不包含用户录波、机组台账或原始配置表。
          安装包与便携版用于预览反馈，需导入已有中文点表。自动化合成数据与界面检查通过；真实文件在 Windows 安装界面的完整批量验收尚待用户复核。
          '@ | Set-Content -LiteralPath $notes -Encoding UTF8
          gh release create $versionTag $installer $portable $bundle --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "BladeScope 3.17.0.25 本地批量证据预览" --notes-file $notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed; existing releases are not overwritten" }
